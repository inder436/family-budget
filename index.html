<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Family Budget"/>
<meta name="theme-color" content="#080c14"/>
<title>Family Budget</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080c14;--surface:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.08);
  --text:#f0f4ff;--muted:rgba(255,255,255,0.38);
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:var(--safe-top);padding-bottom:var(--safe-bot)}
#header{padding:14px 20px 10px;background:rgba(8,12,20,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
#header h1{font-size:17px;font-weight:800;letter-spacing:-0.3px}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
#sync-btn{background:none;border:none;cursor:pointer;font-size:22px;padding:4px;transition:transform 0.4s}
#sync-btn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#month-wrap{padding:10px 16px 8px;flex-shrink:0;background:rgba(8,12,20,0.6)}
.yr-row{display:flex;gap:6px;margin-bottom:8px}
.yr-btn{flex:1;padding:5px 0;border-radius:8px;border:none;cursor:pointer;background:var(--surface);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700}
.yr-btn.on{background:rgba(255,255,255,0.15);color:#fff}
.mo-row{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.mo-btn{padding:7px 2px;border-radius:9px;border:none;cursor:pointer;background:var(--surface);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600}
.mo-btn.on{color:#fff;font-weight:800}
#tab-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 16px;flex-shrink:0}
.t-btn{border:none;cursor:pointer;border-radius:14px;padding:12px 4px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2.5px solid transparent;transition:all 0.2s}
.t-btn .ico{font-size:20px}
.t-btn .lbl{font-size:11px;font-weight:800;color:rgba(255,255,255,0.4)}
.t-btn .val{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace}
.t-btn.on .lbl{color:inherit}
#view-row{display:flex;padding:0 16px 8px;flex-shrink:0}
.v-btn{flex:1;padding:8px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700}
.v-btn:first-child{border-radius:10px 0 0 10px}
.v-btn:last-child{border-radius:0 10px 10px 0;border-left:none}
.v-btn.on{background:rgba(255,255,255,0.1);color:#fff}
#scroll{flex:1;overflow-y:auto;padding:0 16px 32px;-webkit-overflow-scrolling:touch}

/* ADD FORM */
.add-form{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:14px;border:1px solid var(--border)}
.form-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.cat-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cat-btn{padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.cat-btn.on{color:#fff}
.amt-wrap{position:relative;margin-bottom:10px}
.amt-pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:800;pointer-events:none}
.amt-inp{width:100%;padding:13px 14px 13px 34px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.07);color:#fff;font-family:'DM Mono',monospace;font-size:24px;font-weight:600;outline:none;-webkit-appearance:none}
.amt-inp:focus{border-color:rgba(255,255,255,0.35)}
.desc-wrap{position:relative;margin-bottom:12px}
.desc-pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;opacity:0.45}
.desc-inp{width:100%;padding:10px 12px 10px 32px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;-webkit-appearance:none}
.desc-inp::placeholder{color:rgba(255,255,255,0.2)}
.desc-inp:focus{border-color:rgba(255,255,255,0.3)}
.add-btn{width:100%;padding:14px;border-radius:14px;border:none;cursor:pointer;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:800;transition:all 0.3s}

/* TRANSACTION LIST */
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 2px}
.section-title{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.section-total{font-size:14px;font-weight:800;font-family:'DM Mono',monospace}
.txn-card{background:var(--surface);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:8px}
.txn-item{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);gap:10px}
.txn-item:last-child{border-bottom:none}
.txn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.txn-info{flex:1;min-width:0}
.txn-desc{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-meta{font-size:11px;color:var(--muted);margin-top:1px}
.txn-amt{font-size:14px;font-weight:800;font-family:'DM Mono',monospace;white-space:nowrap}
.txn-del{background:none;border:none;cursor:pointer;font-size:16px;opacity:0.35;padding:2px 4px;flex-shrink:0;color:var(--text)}
.txn-del:hover{opacity:0.8}
.empty-state{text-align:center;padding:28px 16px;color:var(--muted);font-size:14px}

/* SUMMARY */
.s-card{background:var(--surface);border-radius:18px;border:1px solid var(--border);overflow:hidden;margin-bottom:12px}
.s-head{padding:12px 16px;font-size:10px;font-weight:800;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border)}
.s-row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04)}
.s-row:last-child{border-bottom:none}
.s-left{display:flex;flex-direction:column;gap:2px}
.s-lbl{font-size:14px;font-weight:700}
.s-cnt{font-size:11px;color:var(--muted)}
.s-val{font-size:14px;font-weight:800;font-family:'DM Mono',monospace;white-space:nowrap}
.s-row.sub{padding:5px 16px 5px 30px}
.s-row.sub .s-lbl{font-size:12px;color:var(--muted);font-weight:600}
.s-row.sub .s-val{font-size:12px;font-weight:700}
.s-row.grand .s-lbl{font-size:15px;color:var(--muted)}
.s-row.grand .s-val{font-size:26px;font-weight:800;color:#fff}
.b-row{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.03);cursor:pointer}
.b-meta{display:flex;justify-content:space-between;margin-bottom:5px}
.b-mo{font-size:13px;color:var(--muted)}
.b-v{font-size:13px;font-weight:700;font-family:'DM Mono',monospace}
.b-mo.cur,.b-v.cur{color:#fff;font-weight:800}
.b-bar{height:5px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden;display:flex}
.b-bar span{display:block;height:100%}
.b-mini{display:flex;gap:8px;margin-top:3px}
.b-mini span{font-size:10px;font-family:'DM Mono',monospace}
.yr-tot{padding:14px 16px;background:rgba(255,255,255,0.02)}
.yr-ttl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.yr-r{display:flex;justify-content:space-between;margin-bottom:6px}
.yr-r .yl{font-size:13px;font-weight:700}
.yr-r .yv{font-size:13px;font-weight:800;font-family:'DM Mono',monospace;color:#fff}
.yr-div{border:none;border-top:1px solid var(--border);margin:8px 0}

#toast{position:fixed;bottom:calc(30px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(20px);background:rgba(20,25,40,0.96);border:1px solid var(--border);border-radius:20px;padding:10px 20px;font-size:13px;font-weight:700;color:#fff;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(12px);z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div>
      <h1>💰 Family Budget</h1>
      <div class="sub" id="status">Loading…</div>
    </div>
    <button id="sync-btn" onclick="syncData()">🔄</button>
  </div>
  <div id="month-wrap">
    <div class="yr-row" id="yr-row"></div>
    <div class="mo-row" id="mo-row"></div>
  </div>
  <div id="tab-row"></div>
  <div id="view-row">
    <button class="v-btn on" id="ve" onclick="setView('entry')">✏️ Entry</button>
    <button class="v-btn"    id="vs" onclick="setView('summary')">📊 Summary</button>
  </div>
  <div id="scroll"></div>
</div>
<div id="toast"></div>

<script>
var API = "https://script.google.com/macros/s/AKfycbz1Pbwkdtk2NlfR04DP8UfN_VJUfdP2na_oJ4uqTT0QczF6taTx8B4Qgfjl3hgc30en/exec";
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var NOW = new Date();
var CY = NOW.getFullYear();
var CM = NOW.getMonth();

// Tabs
var TABS = [
  {id:"moon",   lbl:"Moon",   ico:"👩", col:"#e879f9", glow:"rgba(232,121,249,0.3)"},
  {id:"inder",  lbl:"Inder",  ico:"👨", col:"#38bdf8", glow:"rgba(56,189,248,0.3)"},
  {id:"shared", lbl:"Shared", ico:"🏡", col:"#4ade80", glow:"rgba(74,222,128,0.3)"}
];

// Categories per tab
var TAB_CATS = {
  moon:   [{id:"moon",    lbl:"Personal", col:"#e879f9"}],
  inder:  [{id:"inder",   lbl:"Personal", col:"#38bdf8"}],
  shared: [{id:"grocery", lbl:"🛒 Grocery", col:"#fb923c"},
           {id:"house",   lbl:"🏠 House",   col:"#4ade80"}]
};

var ALL_CATS = ["moon","inder","grocery","house"];

// State
var S = {
  year:CY, month:CM, tab:"moon", view:"entry",
  selCat:"moon",   // selected category in add form
  newAmt:"",
  newDesc:"",
  txns:[],         // all transactions loaded from sheet
  saving:false
};

// ── HELPERS ──
function fmt(v){return "$"+Number(v||0).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2})}
function prs(s){return Math.round(parseFloat(String(s||"").replace(/[^0-9.]/g,""))*100||0)/100}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

// Filter txns for current month/year/tab
function monthTxns(tab,m,y){
  m=m!=null?m:S.month; y=y!=null?y:S.year;
  var cats = TAB_CATS[tab].map(function(c){return c.id});
  return S.txns.filter(function(t){
    return t.year===y && t.month===m && cats.indexOf(t.cat)>=0;
  });
}

function catTxns(cat,m,y){
  m=m!=null?m:S.month; y=y!=null?y:S.year;
  return S.txns.filter(function(t){return t.year===y&&t.month===m&&t.cat===cat});
}

function catTotal(cat,m,y){
  return catTxns(cat,m,y).reduce(function(s,t){return s+t.amt},0);
}

function tabTotal(tab,m,y){
  return TAB_CATS[tab].reduce(function(s,c){return s+catTotal(c.id,m,y)},0);
}

function grandTotal(m,y){
  return ALL_CATS.reduce(function(s,id){return s+catTotal(id,m,y)},0);
}

function tyt(tab,y){var t=0;for(var m=0;m<12;m++)t+=tabTotal(tab,m,y);return t}
function yg(y){var t=0;for(var m=0;m<12;m++)t+=grandTotal(m,y);return t}

// ── API ──
function syncData(){
  var btn=document.getElementById("sync-btn");
  var st=document.getElementById("status");
  btn.classList.add("spin"); st.textContent="Syncing…";
  fetch(API+"?action=get&t="+Date.now())
    .then(function(r){return r.json()})
    .then(function(j){
      if(j.ok && j.txns){S.txns=j.txns}
      st.textContent="Updated "+new Date().toLocaleTimeString();
      btn.classList.remove("spin");
      render();
    })
    .catch(function(){
      st.textContent="Offline";
      btn.classList.remove("spin");
      render();
    });
}

function addTxn(){
  var amt=prs(S.newAmt);
  if(!amt){toast("⚠️ Enter an amount first");return}
  var txn={id:uid(),year:S.year,month:S.month,cat:S.selCat,amt:amt,desc:(S.newDesc||"").trim(),ts:Date.now()};
  S.txns.push(txn);
  S.newAmt=""; S.newDesc="";
  toast("💾 Saving…");
  fetch(API+"?action=add&id="+txn.id+"&year="+txn.year+"&month="+txn.month
    +"&cat="+txn.cat+"&amt="+txn.amt+"&desc="+encodeURIComponent(txn.desc)+"&ts="+txn.ts+"&t="+Date.now())
    .then(function(){toast("✅ Added!")})
    .catch(function(){toast("❌ Save failed")});
  renderContent();
  // scroll to top of list
  var sc=document.getElementById("scroll"); if(sc)sc.scrollTop=0;
}

function delTxn(id){
  S.txns=S.txns.filter(function(t){return t.id!==id});
  fetch(API+"?action=del&id="+id+"&t="+Date.now())
    .then(function(){toast("🗑 Deleted")})
    .catch(function(){toast("❌ Delete failed")});
  renderContent();
}

function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  setTimeout(function(){el.classList.remove("show")},2200);
}

// ── RENDER ──
function render(){renderYears();renderMonths();renderTabs();renderContent()}

function renderYears(){
  var html="";
  [CY-1,CY,CY+1].forEach(function(y){
    html+='<button class="yr-btn'+(S.year===y?' on':'')+'" onclick="setYear('+y+')">'+y+'</button>';
  });
  document.getElementById("yr-row").innerHTML=html;
}

function renderMonths(){
  var tab=TABS.filter(function(t){return t.id===S.tab})[0];
  var html="";
  MONTHS.forEach(function(mo,i){
    var on=S.month===i;
    var sty=on?'background:'+tab.col+'cc;box-shadow:0 2px 10px '+tab.glow:'';
    html+='<button class="mo-btn'+(on?' on':'')+'" style="'+sty+'" onclick="setMonth('+i+')">'+mo+'</button>';
  });
  document.getElementById("mo-row").innerHTML=html;
}

function renderTabs(){
  var html="";
  TABS.forEach(function(t){
    var on=S.tab===t.id;
    var sty=on?'background:'+t.col+'22;border-top-color:'+t.col+';box-shadow:0 4px 18px '+t.glow:'';
    var lsty=on?'color:'+t.col:'';
    html+='<button class="t-btn'+(on?' on':'')+'" style="'+sty+'" onclick="setTab(\''+t.id+'\')">'
      +'<span class="ico">'+t.ico+'</span>'
      +'<span class="lbl" style="'+lsty+'">'+t.lbl+'</span>'
      +'<span class="val">'+fmt(tabTotal(t.id,S.month,S.year))+'</span>'
      +'</button>';
  });
  document.getElementById("tab-row").innerHTML=html;
}

function renderContent(){
  if(S.view==="entry")renderEntry(); else renderSummary();
}

function renderEntry(){
  var tab=TABS.filter(function(t){return t.id===S.tab})[0];
  var cats=TAB_CATS[S.tab];
  var html="";

  // ── ADD FORM ──
  html+='<div class="add-form">';
  html+='<div class="form-title">+ New Expense</div>';

  // category selector (only show for shared tab)
  if(S.tab==="shared"){
    html+='<div class="cat-row">';
    cats.forEach(function(c){
      var on=S.selCat===c.id;
      var sty=on?'background:'+c.col+'33;border-color:'+c.col+';color:#fff':'';
      html+='<button class="cat-btn'+(on?' on':'')+'" style="'+sty+'" onclick="selCat(\''+c.id+'\')">'+c.lbl+'</button>';
    });
    html+='</div>';
  }

  var acol=cats.length===1?cats[0].col:(cats.filter(function(c){return c.id===S.selCat})[0]||cats[0]).col;

  html+='<div class="amt-wrap">'
    +'<span class="amt-pre" style="color:'+acol+'">$</span>'
    +'<input class="amt-inp" id="new-amt" type="number" inputmode="decimal" placeholder="0.00" value="'+esc(S.newAmt)+'" '
    +'oninput="S.newAmt=this.value"/>'
    +'</div>'
    +'<div class="desc-wrap">'
    +'<span class="desc-pre">📝</span>'
    +'<input class="desc-inp" id="new-desc" type="text" placeholder="Description e.g. Costco, electricity…" value="'+esc(S.newDesc)+'" '
    +'oninput="S.newDesc=this.value"/>'
    +'</div>'
    +'<button class="add-btn" onclick="addTxn()" '
    +'style="background:linear-gradient(135deg,'+acol+','+acol+'99);box-shadow:0 4px 18px '+tab.glow+'">'
    +'＋ Add Expense</button>'
    +'</div>';

  // ── TRANSACTION LIST ──
  var txns=monthTxns(S.tab,S.month,S.year);
  // sort newest first
  txns=txns.slice().sort(function(a,b){return b.ts-a.ts});
  var total=tabTotal(S.tab,S.month,S.year);

  html+='<div class="section-head">'
    +'<span class="section-title">'+MONTHS[S.month]+' Transactions</span>'
    +'<span class="section-total" style="color:'+tab.col+'">'+fmt(total)+'</span>'
    +'</div>';

  if(!txns.length){
    html+='<div class="empty-state">No expenses yet for '+MONTHS[S.month]+'<br>Add one above 👆</div>';
  } else {
    html+='<div class="txn-card">';
    txns.forEach(function(t){
      var catInfo=null;
      ALL_CATS.forEach(function(id){if(id===t.cat)catInfo=id});
      var col=acol;
      if(t.cat==="moon")col="#e879f9";
      else if(t.cat==="inder")col="#38bdf8";
      else if(t.cat==="grocery")col="#fb923c";
      else if(t.cat==="house")col="#4ade80";
      var catLbl=t.cat==="grocery"?"🛒":t.cat==="house"?"🏠":"";
      var d=new Date(t.ts);
      var dateStr=d.getDate()+" "+MONTHS[d.getMonth()];
      html+='<div class="txn-item">'
        +'<div class="txn-dot" style="background:'+col+'"></div>'
        +'<div class="txn-info">'
        +'<div class="txn-desc">'+(t.desc||(catLbl+" Expense")||"Expense")+'</div>'
        +'<div class="txn-meta">'+dateStr+(catLbl?' · '+catLbl:'')+'</div>'
        +'</div>'
        +'<span class="txn-amt" style="color:'+col+'">'+fmt(t.amt)+'</span>'
        +'<button class="txn-del" onclick="delTxn(\''+t.id+'\')" title="Delete">✕</button>'
        +'</div>';
    });
    html+='</div>';
  }

  document.getElementById("scroll").innerHTML=html;
}

function renderSummary(){
  var m=S.month,y=S.year;
  var mV=catTotal("moon",m,y), mN=catTxns("moon",m,y).length;
  var iV=catTotal("inder",m,y), iN=catTxns("inder",m,y).length;
  var gV=catTotal("grocery",m,y), gN=catTxns("grocery",m,y).length;
  var hV=catTotal("house",m,y), hN=catTxns("house",m,y).length;
  var shV=gV+hV, tot=mV+iV+shV;

  function sr(lbl,col,val,cnt,cls){
    return '<div class="s-row'+(cls?' '+cls:'')+'">'
      +'<div class="s-left"><span class="s-lbl" style="color:'+col+'">'+lbl+'</span>'
      +(cnt?'<span class="s-cnt">'+cnt+' transaction'+(cnt!==1?'s':'')+'</span>':'')
      +'</div><span class="s-val">'+fmt(val)+'</span></div>';
  }

  var html='<div class="s-card">'
    +'<div class="s-head">'+MONTHS[m]+' '+y+' — Breakdown</div>'
    +sr("👩 Moon","#e879f9",mV,mN)
    +sr("👨 Inder","#38bdf8",iV,iN)
    +'<div class="s-row"><div class="s-left"><span class="s-lbl" style="color:#4ade80">🏡 Shared</span>'
    +'<span class="s-cnt">'+(gN+hN)+' transactions</span></div><span class="s-val">'+fmt(shV)+'</span></div>'
    +sr("🛒 Grocery","#fb923c",gV,gN,"sub")
    +sr("🏠 House","#4ade80",hV,hN,"sub")
    +'<div class="s-row grand"><div class="s-left"><span class="s-lbl">Grand Total</span></div>'
    +'<span class="s-val">'+fmt(tot)+'</span></div>'
    +'</div>';

  var ats=[];
  for(var i=0;i<12;i++)ats.push(grandTotal(i,y));
  var mx=Math.max.apply(null,ats.concat([1]));

  if(ats.some(function(v){return v>0})){
    html+='<div class="s-card"><div class="s-head">'+y+' — Monthly</div>';
    ats.forEach(function(t,i){
      if(!t)return;
      var mv=catTotal("moon",i,y),iv=catTotal("inder",i,y),grv=catTotal("grocery",i,y),hv=catTotal("house",i,y);
      var cur=i===m;
      html+='<div class="b-row" onclick="goMonth('+i+')">'
        +'<div class="b-meta"><span class="b-mo'+(cur?' cur':'')+'">'+MONTHS[i]+'</span>'
        +'<span class="b-v'+(cur?' cur':'')+'">'+fmt(t)+'</span></div>'
        +'<div class="b-bar">'
        +'<span style="width:'+(mv/mx*100)+'%;background:#e879f9"></span>'
        +'<span style="width:'+(iv/mx*100)+'%;background:#38bdf8"></span>'
        +'<span style="width:'+(grv/mx*100)+'%;background:#fb923c"></span>'
        +'<span style="width:'+(hv/mx*100)+'%;background:#4ade80"></span>'
        +'</div>'
        +'<div class="b-mini">'
        +'<span style="color:#e879f9">👩'+fmt(mv)+'</span>'
        +'<span style="color:#38bdf8">👨'+fmt(iv)+'</span>'
        +'<span style="color:#4ade80">🏡'+fmt(grv+hv)+'</span>'
        +'</div></div>';
    });
    html+='<div class="yr-tot"><div class="yr-ttl">'+y+' Year Totals</div>'
      +'<div class="yr-r"><span class="yl" style="color:#e879f9">👩 Moon</span><span class="yv">'+fmt(tyt("moon",y))+'</span></div>'
      +'<div class="yr-r"><span class="yl" style="color:#38bdf8">👨 Inder</span><span class="yv">'+fmt(tyt("inder",y))+'</span></div>'
      +'<div class="yr-r"><span class="yl" style="color:#4ade80">🏡 Shared</span><span class="yv">'+fmt(tyt("shared",y))+'</span></div>'
      +'<hr class="yr-div"/>'
      +'<div class="yr-r"><span class="yl" style="font-size:15px;color:rgba(255,255,255,0.6)">All '+y+'</span>'
      +'<span class="yv" style="font-size:18px">'+fmt(yg(y))+'</span></div>'
      +'</div></div>';
  }

  document.getElementById("scroll").innerHTML=html;
}

// ── SETTERS ──
function setYear(y){S.year=y;render()}
function setMonth(m){S.month=m;render()}
function setTab(id){
  S.tab=id;
  S.selCat=TAB_CATS[id][0].id;
  render();
}
function selCat(id){S.selCat=id;renderContent()}
function setView(v){
  S.view=v;
  document.getElementById("ve").classList.toggle("on",v==="entry");
  document.getElementById("vs").classList.toggle("on",v==="summary");
  renderContent();
}
function goMonth(m){S.month=m;setView("entry");render()}

// ── BOOT ──
S.selCat=TAB_CATS[S.tab][0].id;
render();
syncData();
</script>
</body>
</html>
